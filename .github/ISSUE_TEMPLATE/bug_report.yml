name: Bug report
description: Report a reproducible Primbyul problem
title: "[Bug] "
labels:
  - bug
body:
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS Apple Silicon
        - macOS Intel
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Primbyul version
      placeholder: 1.5.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest repeatable sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Do not attach signing certificates, private photos, or secrets.
